<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2a47;--navy2:#0a1d33;--gold:#e8c872;--bg:#f3f5f8;--red:#c0392b;--green:#1e8e5a}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:#1b2733}
header{background:var(--navy2);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:1.05rem;margin:0;color:var(--gold)}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;background:#fff;border-bottom:1px solid #dde3ea}
nav button{border:1px solid #cfd8e3;background:#fff;border-radius:20px;padding:7px 13px;font:inherit;font-size:.88rem;cursor:pointer}
nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
nav .badge{background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:.72rem;margin-inline-start:4px}
main{max-width:980px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--navy);color:#fff;border-radius:12px;padding:14px;text-align:center}
.stat b{display:block;font-size:1.6rem;color:var(--gold)}
button.b{border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;background:var(--navy);color:#fff}
button.g{background:var(--green)}button.r{background:var(--red)}button.o{background:#fff;color:var(--navy);border:1px solid var(--navy)}
input,textarea,select{width:100%;padding:9px;border:1px solid #cbd5e0;border-radius:8px;font:inherit;margin:3px 0 10px;background:#fff}
textarea{min-height:130px}label{font-size:.85rem;font-weight:600;color:#435166}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eef1f5}
.row:last-child{border-bottom:0}.muted{color:#6b7a8c;font-size:.82rem}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.75rem;background:#e7edf5}
.tag.ok{background:#d9f2e6;color:#14663f}.tag.no{background:#fde2de;color:#9b2c20}.tag.wait{background:#fff0c9;color:#7a5a00}
#login{max-width:340px;margin:12vh auto;text-align:center}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:8px}
.bars div{flex:1;background:var(--gold);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:.6rem;color:#667}
#msg{position:fixed;bottom:14px;right:14px;left:14px;max-width:420px;margin:auto;background:#111c2b;color:#fff;border-radius:10px;padding:11px 14px;display:none;z-index:20;text-align:center}
.hide{display:none}
</style>
</head>
<body>
<div id="login" class="card">
  <h2>لوحة التحكم</h2>
  <p class="muted">للمسؤول فقط</p>
  <input type="password" id="pw" placeholder="كلمة المرور" autocomplete="current-password">
  <button class="b" style="width:100%" id="loginBtn">دخول</button>
  <p id="lmsg" class="muted"></p>
</div>
<div id="app" class="hide">
  <header><h1>⚖️ الحقانية، لوحة التحكم</h1><button class="b o" id="logout" style="padding:4px 10px">خروج</button></header>
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="msg"></div>
<script>
const API='/api/admin';
let TOKEN=sessionStorage.getItem('hq_t')||'';
let tab='stats', editing=null, cache={};
const TYPES={
 articles:{label:'المقالات',fields:[['title_ar','العنوان (عربي)'],['title_en','العنوان (English)'],['title_fr','Titre (Français)'],['content_ar','المحتوى (عربي) يقبل HTML','ta'],['content_en','Content (English)','ta'],['content_fr','Contenu (Français)','ta'],['image','رابط الصورة'],['category','التصنيف'],['Tags','الكلمات المفتاحية'],['publish_at','تاريخ ووقت النشر','dt'],['status','الحالة','st']],title:'title_ar'},
 library:{label:'المكتبة',fields:[['title_ar','العنوان (عربي)'],['title_en','Title'],['title_fr','Titre'],['author','المؤلف'],['description_ar','الوصف (عربي)','ta'],['description_en','Description','ta'],['description_fr','Description FR','ta'],['file_link','رابط الملف'],['category','التصنيف'],['status','الحالة','st']],title:'title_ar'},
 products:{label:'النماذج المدفوعة',fields:[['name_ar','الاسم (عربي)'],['name_en','Name'],['name_fr','Nom'],['price','السعر'],['short_desc_ar','وصف قصير (عربي)'],['short_desc_en','Short desc'],['short_desc_fr','Desc courte'],['full_desc_ar','وصف كامل (عربي)','ta'],['full_desc_en','Full desc','ta'],['full_desc_fr','Desc complète','ta'],['file_link','رابط الملف'],['status','الحالة','st']],title:'name_ar'},
 judgments:{label:'الأحكام',fields:[['title_ar','العنوان (عربي)'],['title_en','Title'],['title_fr','Titre'],['court','المحكمة'],['summary_ar','الملخص (عربي)','ta'],['summary_en','Summary','ta'],['summary_fr','Résumé','ta'],['file_link','رابط الملف'],['date','التاريخ'],['status','الحالة','st']],title:'title_ar'},
 extras:{label:'الروابط المفيدة',fields:[['Name','الاسم'],['Link','الرابط'],['Category','التصنيف']],title:'Name'}
};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',3200)}
async function api(body){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify(body)});
  if(r.status===401&&body.action!=='login'){logout();throw new Error('auth')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||('http_'+r.status));
  return j;
}
function logout(){localStorage.removeItem('hq_adm');TOKEN='';sessionStorage.removeItem('hq_t');localStorage.setItem('hq_noc','1');$('#app').classList.add('hide');$('#login').classList.remove('hide')}
async function login(){
  $('#lmsg').textContent='';
  try{const j=await api({action:'login',password:$('#pw').value});TOKEN=j.token;sessionStorage.setItem('hq_t',TOKEN);localStorage.setItem('hq_noc','1');$('#pw').value='';start()}
  catch(e){$('#lmsg').textContent=e.message==='locked'?'محاولات كتير، استنى 15 دقيقة':'كلمة المرور غلط'}
}
$('#loginBtn').onclick=login;$('#pw').onkeydown=e=>{if(e.key==='Enter')login()};$('#logout').onclick=logout;
function buildTabs(badges){
  const t=[['stats','📊 الإحصائيات']].concat(Object.keys(TYPES).map(k=>[k,TYPES[k].label])).concat([['comments','💬 التعليقات'],['reviews','⭐ التقييمات'],['students','👥 الطلاب'],['orders','💳 المدفوعات'],['posts','📝 المنشورات'],['pcomments','💭 تعليقات الطلاب'],['reports','🚩 البلاغات'],['questions','❓ أسئلة الطلاب'],['problems','🧮 المسائل'],['daily','📅 مسألة اليوم'],['honor','🏆 الشرف'],['site','🖊 نصوص وصور'],['prices','💰 الأسعار'],['certs','🎓 الشهادات'],['notes','📄 ملف المذكرة'],['settings','⚙️ الإعدادات']]);
  $('#tabs').innerHTML=t.map(([k,l])=>`<button data-k="${k}" class="${k===tab?'on':''}">${l}${badges&&badges[k]?`<span class="badge">${badges[k]}</span>`:''}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;editing=null;render()});
}
async function start(){localStorage.setItem('hq_adm','1');$('#login').classList.add('hide');$('#app').classList.remove('hide');render()}
async function render(){
  const v=$('#view');v.innerHTML='<div class="card muted">جاري التحميل...</div>';
  try{
    let badges={};
    try{const s=await api({action:'stats'});badges={comments:s.pending_comments,reviews:s.pending_reviews};try{const s2=await api({action:'stats2'});cache.s2=s2;badges.orders=s2.orders_pending;badges.reports=s2.reports_open}catch(e){}cache.stats=s}catch(e){if(e.message==='auth')return}
    buildTabs(badges);
    if(tab==='stats')return renderStats();
    if(tab==='settings')return renderSettings();
    if(EXT[tab])return EXT[tab]();
    if(tab==='comments'||tab==='reviews')return renderMod(tab);
    return editing?renderForm(tab):renderList(tab);
  }catch(e){if(e.message!=='auth')v.innerHTML='<div class="card">حصل خطأ: '+esc(e.message)+'</div>'}
}
function renderStats(){
  const s=cache.stats,max=Math.max(1,...s.daily.map(d=>d.views));
  $('#view').innerHTML=`<div class="grid">
  <div class="stat"><b>${s.views}</b>إجمالي المشاهدات</div><div class="stat"><b>${s.visitors}</b>زوار مختلفين</div>
  <div class="stat"><b>${s.daily[s.daily.length-1].views}</b>مشاهدات النهارده</div><div class="stat"><b>${s.total_likes}</b>إجمالي اللايكات</div>
  <div class="stat"><b>${s.pending_comments+s.pending_reviews}</b>في انتظار موافقتك</div><div class="stat"><b>${s.articles}</b>مقال</div>
  <div class="stat"><b>${s.wa_total||0}</b>ضغطات واتساب</div><div class="stat"><b>${(s.daily[s.daily.length-1].wa)||0}</b>ضغطات واتساب النهارده</div></div>
  <div class="card" style="margin-top:12px"><b>آخر 14 يوم</b><div class="bars" style="margin-bottom:22px">${s.daily.map(d=>`<div style="height:${Math.max(2,d.views/max*100)}%" title="${d.day}: ${d.views}"><span>${d.day.slice(8)}</span></div>`).join('')}</div></div>
  <div class="card"><b>الصفحات اللي جاب منها ضغطات واتساب</b>${(s.wa_pages||[]).length?s.wa_pages.map(p=>`<div class="row"><span>${esc(p.path)}</span><b>${p.clicks}</b></div>`).join(''):'<p class="muted">لسه مفيش ضغطات متسجلة.</p>'}</div>
  <div class="card"><b>أكتر الصفحات زيارة</b>${s.pages.length?s.pages.map(p=>`<div class="row"><span>${esc(p.path)}</span><b>${p.views}</b></div>`).join(''):'<p class="muted">لسه مفيش زيارات متسجلة.</p>'}</div>
  <div class="card"><b>نقل محتوى الموقع القديم</b><p class="muted">ينقل المقالات والمكتبة والنماذج والأحكام والروابط والتقييمات القديمة للوحة الجديدة. يتعمل مرة واحدة، ولو في بيانات موجودة بيتخطاها.</p><button class="b" id="imp">نقل المحتوى القديم</button></div>`;
  $('#imp').onclick=async()=>{if(!confirm('ننقل المحتوى القديم؟'))return;try{const j=await api({action:'import_legacy'});toast('تم: '+Object.entries(j.report).map(([k,v])=>k+'='+v).join('، '))}catch(e){toast('فشل النقل')}};
}
async function renderList(type){
  const j=await api({action:'list',type});const T=TYPES[type];
  $('#view').innerHTML=`<div class="card"><div class="row" style="border:0"><b>${T.label} (${j.items.length})</b><button class="b g" id="new">➕ جديد</button></div>
  ${j.items.map(it=>`<div class="row"><div><b>${esc(it[T.title]||it.title_en||'(بدون عنوان)')}</b><div class="muted">${type==='articles'?esc(it.date||'')+' · ❤ '+(it.likes||0)+' · ':''}<span class="tag ${it.status==='draft'?'wait':'ok'}">${it.status==='draft'?'مسودة':(type==='articles'&&Date.parse(it.publish_at)>Date.now()?'مجدول':'منشور')}</span></div></div>
  <div><button class="b o" data-e="${esc(it.id)}">تعديل</button> <button class="b r" data-d="${esc(it.id)}">حذف</button></div></div>`).join('')||'<p class="muted">فاضي</p>'}</div>`;
  cache.items=j.items;
  $('#new').onclick=()=>{editing={};render()};
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{editing=cache.items.find(x=>String(x.id)===b.dataset.e);render()});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('تأكيد الحذف؟'))return;await api({action:'delete',type,id:b.dataset.d});toast('اتحذف');render()});
}
const toLocalInput=iso=>{if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';const o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,16)};
function renderForm(type){
  const T=TYPES[type],it=editing||{};
  const def=type==='articles'&&!it.publish_at?toLocalInput(new Date().toISOString()):toLocalInput(it.publish_at);
  $('#view').innerHTML=`<div class="card"><b>${it.id?'تعديل':'إضافة'} ${T.label}</b><div style="margin-top:10px">`+T.fields.map(([k,l,t])=>{
    const v=it[k]==null?'':it[k];
    if(t==='ta')return `<label>${l}</label><textarea data-k="${k}">${esc(v)}</textarea>`;
    if(t==='st')return `<label>${l}</label><select data-k="${k}"><option value="active" ${v!=='draft'?'selected':''}>منشور</option><option value="draft" ${v==='draft'?'selected':''}>مسودة (مخفي)</option></select>`;
    if(t==='dt')return `<label>${l} (لو في المستقبل، المقال يظهر في الميعاد ده)</label><input type="datetime-local" data-k="${k}" value="${def}">`;
    if(['image','file_link','Link'].includes(k))return `<label>${l} (الصق رابط أو ارفع ملف)</label><div style="display:flex;gap:6px"><input data-k="${k}" value="${esc(v)}" style="flex:1"><button type="button" class="b o" data-up="${k}">⬆ رفع ملف</button></div><small class="muted" data-upmsg="${k}"></small>`;
    return `<label>${l}</label><input data-k="${k}" value="${esc(v)}">`}).join('')+
  `<button class="b g" id="save">حفظ</button> <button class="b o" id="cancel">إلغاء</button></div></div>`;
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.up,msg=document.querySelector('[data-upmsg="'+k+'"]');
    const f=document.createElement('input');f.type='file';f.accept=k==='image'?'image/*':'';
    f.onchange=async()=>{const file=f.files[0];if(!file)return;
      try{msg.textContent='جاري الرفع...';
        const m=await import('https://esm.sh/@vercel/blob@1.0.2/client');
        const r=await m.upload(file.name.replace(/[^A-Za-z0-9._-]/g,'_')||'file',file,{access:'public',handleUploadUrl:'/api/upload',clientPayload:TOKEN,multipart:file.size>5000000,onUploadProgress:p=>{msg.textContent='جاري الرفع '+Math.round(p.percentage)+'%'}});
        document.querySelector('input[data-k="'+k+'"]').value=r.url;msg.textContent='تم الرفع، اضغط حفظ';
      }catch(e){msg.textContent='فشل الرفع: '+(e.message||e)}};
    f.click()});
  $('#cancel').onclick=()=>{editing=null;render()};
  $('#save').onclick=async()=>{
    const item=Object.assign({},it);
    document.querySelectorAll('[data-k]').forEach(e=>{const k=e.dataset.k;item[k]=e.value});
    if(type==='articles')item.publish_at=item.publish_at?new Date(item.publish_at).toISOString():new Date().toISOString();
    try{await api({action:'save',type,item});toast('تم الحفظ');editing=null;render()}catch(e){toast('فشل الحفظ')}
  };
}
async function renderMod(type){
  const j=await api({action:'list',type}),arts=(await api({action:'list',type:'articles'})).items;
  const an={};arts.forEach(a=>an[a.id]=a.title_ar);
  const tg={site:'الموقع',office:'المكتب',article:'مقال'};
  const st={approved:['ok','ظاهر'],pending:['wait','في الانتظار'],hidden:['no','مخفي']};
  $('#view').innerHTML=`<div class="card"><b>${type==='comments'?'التعليقات':'التقييمات'} (${j.items.length})</b>`+(j.items.map(c=>`<div class="row"><div style="flex:1;min-width:220px"><b>${esc(c.name)}</b> ${c.rating?'⭐'.repeat(c.rating):''} <span class="tag ${st[c.status]?st[c.status][0]:''}">${st[c.status]?st[c.status][1]:esc(c.status)}</span>
  <div>${esc(c.text)}</div><div class="muted">${esc((c.created||'').slice(0,10))}${c.target?' · '+tg[c.target]:''}${c.article_id&&an[c.article_id]?' · '+esc(an[c.article_id]):''}</div>${c.reply?`<div class="muted">ردك: ${esc(c.reply)}</div>`:''}</div>
  <div><button class="b g" data-s="approved" data-i="${esc(c.id)}">إظهار</button> <button class="b o" data-s="hidden" data-i="${esc(c.id)}">إخفاء</button> <button class="b o" data-r="${esc(c.id)}">رد</button> <button class="b r" data-d="${esc(c.id)}">حذف</button></div></div>`).join('')||'<p class="muted">لسه مفيش</p>')+'</div>';
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{await api({action:'status',type,id:b.dataset.i,status:b.dataset.s});toast('تم');render()});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('تأكيد الحذف؟'))return;await api({action:'delete',type,id:b.dataset.d});toast('اتحذف');render()});
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const c=j.items.find(x=>String(x.id)===b.dataset.r);const r=prompt('ردك العلني:',c.reply||'');if(r===null)return;await api({action:'status',type,id:c.id,status:c.status,reply:r});toast('تم');render()});
}
async function renderSettings(){
  const {cfg}=await api({action:'get_settings'});
  $('#view').innerHTML=`<div class="card"><b>الإعدادات</b><label>التعليقات على المقالات</label><select id="cm"><option value="auto" ${cfg.comments_mode==='auto'?'selected':''}>تظهر فورًا (وأنا أخفي أي حاجة مش مناسبة)</option><option value="moderate" ${cfg.comments_mode==='moderate'?'selected':''}>تظهر بعد موافقتي</option></select>
  <label>التقييمات</label><select id="rm"><option value="moderate" ${cfg.reviews_mode!=='auto'?'selected':''}>تظهر بعد موافقتي</option><option value="auto" ${cfg.reviews_mode==='auto'?'selected':''}>تظهر فورًا</option></select>
  <label>عدّاد الزوار في الموقع</label><select id="sc"><option value="1" ${cfg.show_counter!==`0`?`selected`:``}>ظاهر للزوار</option><option value="0" ${cfg.show_counter===`0`?`selected`:``}>مخفي (الأرقام في لوحة التحكم فقط)</option></select>
  <button class="b g" id="ss">حفظ</button></div>`;
  $('#ss').onclick=async()=>{await api({action:'set_settings',cfg:{comments_mode:$('#cm').value,reviews_mode:$('#rm').value,show_counter:$('#sc').value}});toast('تم الحفظ')};
}

const V=()=>$('#view');
const fdate=s=>esc(String(s||'').replace('T',' ').slice(0,16));
const NM={husband:'الزوج',wife:'الزوجة',father:'الأب',mother:'الأم',sons:'الابن',daughters:'البنت',sonSons:'ابن الابن',sonDaughters:'بنت الابن',fullBrothers:'الأخ الشقيق',fullSisters:'الأخت الشقيقة',paternalBrothers:'الأخ لأب',paternalSisters:'الأخت لأب',maternalBrothers:'الأخ لأم',maternalSisters:'الأخت لأم',grandfatherFather:'الجد',grandmotherFather:'الجدة (أم الأب)',grandmotherMother:'الجدة (أم الأم)'};
async function tl(type){return (await api({action:'t_list',type})).items}
const EXT={
 async students(){const it=await tl('students');const s2=cache.s2||{};
  V().innerHTML=`<div class="card"><b>الطلاب (${it.length})</b> <span class="muted">محظور: ${it.filter(x=>x.banned).length}</span></div>`+it.map(u=>`<div class="card row"><div style="flex:1;min-width:220px"><b>${esc(u.name||'(بدون اسم)')}</b> ${u.banned?'<span class="tag no">محظور</span>':''} ${u.role==='staff'?'<span class="tag ok">مساعد</span>':''}<div class="muted" dir="ltr">${esc(u.email)} | ${esc(u.provider||'')}</div><div class="muted">آخر دخول: ${fdate(u.last)}</div></div><div><button class="b o" data-op="rename" data-i="${esc(u.id)}">اسم</button> ${u.banned?`<button class="b g" data-op="unban" data-i="${esc(u.id)}">فك الحظر</button>`:`<button class="b r" data-op="ban" data-i="${esc(u.id)}">حظر الحساب</button> <button class="b r" data-op="ban_network" data-i="${esc(u.id)}">حظر + الشبكة</button>`} <button class="b o" data-op="grant" data-i="${esc(u.id)}">منح المذكرة</button> <button class="b o" data-op="role" data-i="${esc(u.id)}" data-r="${u.role==='staff'?'student':'staff'}">${u.role==='staff'?'إلغاء مساعد':'مساعد'}</button> <button class="b r" data-op="delete" data-i="${esc(u.id)}">حذف</button></div></div>`).join('');
  document.querySelectorAll('[data-op]').forEach(b=>b.onclick=async()=>{const op=b.dataset.op,id=b.dataset.i;

   else if(op==='rename'){const n=prompt('الاسم الجديد');if(!n)return;await api({action:'student_act',id,op,name:n})}
   else if(op==='role'){await api({action:'student_act',id,op,role:b.dataset.r})}
   else{if(!confirm(op==='ban_network'?'حظر الحساب والأجهزة والشبكة؟ (قد يصيب غيره على نفس الشبكة)':op==='delete'?'حذف الطالب وطلباته نهائيًا؟':'تأكيد؟'))return;await api({action:'student_act',id,op,reason:'admin'})}
   toast('تم');EXT.students()})},
 async orders(){const it=await tl('orders');const st={awaiting:['wait','ينتظر الدفع'],provisional:['wait','تحميل مؤقت: أكد وصول المبلغ'],approved:['ok','مؤكد'],rejected:['no','مرفوض'],cheat:['no','لم يصل: حظر']};
  V().innerHTML=`<div class="card"><b>المدفوعات (${it.length})</b><div class="muted">"أكد وصول المبلغ" بعد ما تتأكد من حسابك. "لم يصل" يحظر الطالب نهائيًا بالرسالة المتفق عليها.</div></div>`+it.map(o=>`<div class="card row"><div style="flex:1;min-width:230px"><b>${esc(o.name)}</b> <span class="tag ${st[o.status]?st[o.status][0]:''}">${st[o.status]?st[o.status][1]:esc(o.status)}</span>${o.free?' <span class="tag ok">مجانية</span>':''}<div class="muted" dir="ltr">${esc(o.email)}</div><div>المبلغ المطلوب: <b dir="ltr">${esc(o.amount)}</b>${o.paid_amount?' | المُدخل: <span dir="ltr">'+esc(o.paid_amount)+'</span>':''}</div><div class="muted" dir="ltr">رقم العملية: ${esc(o.txn||'-')} | تنزيلات متبقية: ${o.dl_left}</div><div class="muted">${fdate(o.created)}</div>${o.shot?`<a href="${esc(o.shot)}" target="_blank"><img src="${esc(o.shot)}" style="max-width:160px;margin-top:6px;border:1px solid #ccc"></a>`:''}</div><div>${o.status==='provisional'||o.status==='awaiting'?`<button class="b g" data-op="confirm" data-i="${esc(o.id)}">أكد وصول المبلغ</button> <button class="b r" data-op="cheat" data-i="${esc(o.id)}">لم يصل: حظر</button> `:''}${o.status!=='rejected'&&o.status!=='approved'?`<button class="b o" data-op="reject" data-i="${esc(o.id)}">رفض (بدون حظر)</button> `:''}<button class="b o" data-op="reset_dl" data-i="${esc(o.id)}">تجديد الروابط</button></div></div>`).join('');
  document.querySelectorAll('[data-op]').forEach(b=>b.onclick=async()=>{if(b.dataset.op==='cheat'&&!confirm('المبلغ لم يصل؟ سيُحظر الحساب نهائيًا ويرى الرسالة المتفق عليها.'))return;await api({action:'order_act',id:b.dataset.i,op:b.dataset.op});toast('تم');EXT.orders()})},
 async posts(){return modList('posts','المنشورات',p=>`<b>${esc(p.name)}</b> ${p.status==='hidden'?'<span class="tag no">مخفي</span>':''}<div>${esc(p.text)}</div><div class="muted">${fdate(p.created)}${p.ref?' | مسألة '+esc(p.ref):''}</div>`,true)},
 async pcomments(){return modList('pcomments','تعليقات الطلاب',p=>`<b>${esc(p.name)}</b> ${p.status==='hidden'?'<span class="tag no">مخفي</span>':''}<div>${esc(p.text)}</div><div class="muted">${fdate(p.created)}</div>`,true)},
 async questions(){return modList('questions','أسئلة الطلاب',q=>`<b>${esc(q.name)}</b> ${q.answer?'<span class="tag ok">تم الرد</span>':'<span class="tag wait">مفتوح</span>'}<div>${esc(q.text)}</div>${q.answer?'<div class="muted">ردك: '+esc(q.answer)+'</div>':''}`,false,true)},
 async reports(){const it=await tl('reports');V().innerHTML=`<div class="card"><b>البلاغات (${it.length})</b></div>`+it.map(r=>`<div class="card row"><div style="flex:1"><b>${esc(r.byName)}</b> بلّغ عن ${esc(r.kind)} <span dir="ltr">${esc(r.target)}</span><div>${esc(r.reason)}</div><div class="muted">${fdate(r.created)}</div></div><div><button class="b r" data-x="${esc(r.id)}">إغلاق</button></div></div>`).join('')||'<div class="card muted">لا بلاغات</div>';
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{await api({action:'t_delete',type:'reports',id:b.dataset.x});EXT.reports()})},
 async problems(){const it=await tl('problems');V().innerHTML=`<div class="card"><b>المسائل المحفوظة بالرقم (${it.length})</b><input id="pf" placeholder="ابحث برقم المسألة MR-..." dir="ltr"></div><div id="pl"></div>`;
  const draw=()=>{const f=$('#pf').value.trim().toUpperCase();$('#pl').innerHTML=it.filter(x=>!f||x.id.toUpperCase().includes(f)).slice(0,60).map(x=>`<div class="card row"><div style="flex:1"><b dir="ltr">${esc(x.id)}</b> <span class="muted">${esc(x.source)} | ${fdate(x.created)}</span><div>${Object.keys(x.inp||{}).map(k=>esc(NM[k]||k)+' ('+x.inp[k]+')').join('، ')}</div><div class="muted">${x.log&&x.log.length?'تعديلات: '+x.log.length:''}</div></div><div><a class="b o" href="/calculator?ref=${encodeURIComponent(x.id)}" target="_blank">فتح</a> <button class="b o" data-e="${esc(x.id)}">تعديل الورثة</button></div></div>`).join('');
   document.querySelectorAll('[data-e]').forEach(b=>b.onclick=async()=>{const x=it.find(y=>y.id===b.dataset.e);const t=prompt('عدّل الورثة بصيغة JSON (المفتاح: العدد)',JSON.stringify(x.inp));if(!t)return;let inp;try{inp=JSON.parse(t)}catch(e){toast('JSON غير صحيح');return}const note=prompt('ملاحظة التعديل (تُسجل في السجل)','')||'';await api({action:'problem_save',ref:x.id,inp,note});toast('تم الحفظ وسُجل التعديل');EXT.problems()})};
  $('#pf').oninput=draw;draw()},
 async daily(){V().innerHTML=`<div class="card"><b>تحديد مسألة اليوم يدويًا</b><div class="muted">تُنشر 8 مساء وتظهر إجابتها 7 مساء اليوم التالي. الافتراضي مسألة تلقائية.</div><label>اليوم (YYYY-MM-DD)</label><input id="dd" dir="ltr" value="${new Date().toISOString().slice(0,10)}"><label>الورثة JSON</label><input id="di" dir="ltr" value='{"wife":1,"mother":1,"daughters":2}'><label>المطلوب (مفتاح الوارث)</label><input id="da" dir="ltr" value="mother"><button class="b g" id="ds">حفظ</button></div>`;
  $('#ds').onclick=async()=>{let inp;try{inp=JSON.parse($('#di').value)}catch(e){toast('JSON غير صحيح');return}try{await api({action:'daily_set',day:$('#dd').value,inp,ask:$('#da').value,estate:240000});toast('تم')}catch(e){toast('مسألة غير صالحة: '+e.message)}}},
 async honor(){const w=await api({action:'honor_admin',week:''});V().innerHTML=`<div class="card"><b>لوحة الشرف: الإجمالي</b><div class="muted">لاختيار فائز الأسبوع: افتح الطلاب واضغط "منح المذكرة".</div><table style="width:100%">${w.top.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td dir="ltr">${esc(x.email)}</td><td>${x.n}</td><td><button class="b o" data-g="${esc(x.uid)}">منح المذكرة</button></td></tr>`).join('')}</table></div>`;
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=async()=>{if(!confirm('منح المذكرة مجانًا لهذا الطالب؟'))return;await api({action:'grant_notes',uid:b.dataset.g});toast('تم')})},
 async site(){const s=await api({action:'site_get'});const t=s.ov.t||{},im=s.ov.i||{};V().innerHTML=`<div class="card"><b>نصوص وصور الموقع المعدّلة</b><div class="muted">التعديل يتم من داخل الموقع نفسه: افتح أي صفحة بعد الدخول واضغط زر "إدارة" ثم وضع التعديل. هنا قائمة بما عُدّل، ويمكنك التراجع عن أي تعديل.</div></div><div class="card"><b>نصوص (${Object.keys(t).length})</b>${Object.keys(t).map(k=>`<div class="row"><div style="flex:1"><div class="muted">${esc(k.slice(0,90))}</div><div>${esc(t[k].ar)}</div></div><button class="b r" data-t="${esc(k)}">تراجع</button></div>`).join('')||'<p class="muted">لا شيء</p>'}</div><div class="card"><b>صور (${Object.keys(im).length})</b>${Object.keys(im).map(k=>`<div class="row"><div style="flex:1" class="muted" dir="ltr">${esc(k.slice(0,90))}</div><img src="${esc(im[k])}" style="height:50px"><button class="b r" data-i="${esc(k)}">تراجع</button></div>`).join('')||'<p class="muted">لا شيء</p>'}</div>`;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{delete t[b.dataset.t];await api({action:'site_set',ov:{t,i:im}});EXT.site()});document.querySelectorAll('[data-i]').forEach(b=>b.onclick=async()=>{delete im[b.dataset.i];await api({action:'site_set',ov:{t,i:im}});EXT.site()})},
 async prices(){const s=await api({action:'site_get'});const p=s.prices||{eg:{wa:300,call:500,urgent_wa:450,urgent_call:750},foreign:{wa:40,urgent:60},urgent_promise_hours:1};const f=(id,l,v)=>`<div><label>${l}</label><input id="${id}" type="number" value="${v}"></div>`;
  V().innerHTML=`<div class="card"><b>أسعار الاستشارات</b><div class="muted">المصريون بالجنيه، والأجانب بالدولار (واتساب فقط).</div><div class="row">${f('p1','عادية واتساب (جنيه)',p.eg.wa)}${f('p2','عادية مكالمة (جنيه)',p.eg.call)}${f('p3','عاجلة واتساب (جنيه)',p.eg.urgent_wa)}${f('p4','عاجلة مكالمة (جنيه)',p.eg.urgent_call)}${f('p5','أجانب عادية (دولار)',p.foreign.wa)}${f('p6','أجانب عاجلة (دولار)',p.foreign.urgent)}${f('p7','وعد الرد العاجل (ساعات)',p.urgent_promise_hours)}</div><button class="b g" id="ps">حفظ</button></div>`;
  $('#ps').onclick=async()=>{const n=i=>+$(i).value;await api({action:'site_set',prices:{eg:{wa:n('#p1'),call:n('#p2'),urgent_wa:n('#p3'),urgent_call:n('#p4')},foreign:{wa:n('#p5'),urgent:n('#p6')},urgent_promise_hours:n('#p7')}});toast('تم الحفظ')}},
 async certs(){const s=await api({action:'site_get'});let c=s.certs;if(!c||!c.length){try{const t=await (await fetch('/site.js')).text();const m=t.match(/var DEF_CERTS = (\[[\s\S]*?\n  \]);/);c=m?new Function('return '+m[1])():[];c.forEach((x,i)=>x.id='c'+(i+1))}catch(e){c=[]}}
  const draw=()=>{V().innerHTML=`<div class="card"><b>الشهادات (قسم من نحن)</b><div class="muted">الصياغة المتفق عليها: حاصل على شهادة «...» بدون "معتمد" وبدون تواريخ.</div>${c.map((x,i)=>`<div class="card"><label>صورة (رابط)</label><input data-k="image" data-i="${i}" dir="ltr" value="${esc(x.image)}"><label>عربي</label><textarea data-k="ar" data-i="${i}">${esc(x.ar)}</textarea><label>English</label><textarea data-k="en" data-i="${i}" dir="ltr">${esc(x.en)}</textarea><label>Français</label><textarea data-k="fr" data-i="${i}" dir="ltr">${esc(x.fr)}</textarea><button class="b r" data-del="${i}">حذف</button></div>`).join('')}<button class="b o" id="ca">+ شهادة</button> <button class="b g" id="cs">حفظ</button></div>`;
   document.querySelectorAll('[data-k]').forEach(e=>e.oninput=()=>{c[+e.dataset.i][e.dataset.k]=e.value});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{c.splice(+b.dataset.del,1);draw()});$('#ca').onclick=()=>{c.push({id:'c'+Date.now().toString(36),image:'',ar:'',en:'',fr:''});draw()};$('#cs').onclick=async()=>{await api({action:'site_set',certs:c});toast('تم الحفظ')}};draw()},
 async notes(){const {cfg}=await api({action:'get_settings'});V().innerHTML=`<div class="card"><b>ملف المذكرة (PDF)</b><div class="muted">الملف الحالي: <span dir="ltr">${esc(cfg.notes_file||'لم يُرفع بعد')}</span></div><input type="file" id="nf" accept="application/pdf"><div id="nm" class="muted"></div><button class="b g" id="nu">رفع واعتماد</button><div class="muted">النسخة التي يحمّلها الطالب تحمل اسمه وشعار المكتب على كل صفحة.</div></div>`;
  $('#nu').onclick=async()=>{const f=$('#nf').files[0];if(!f)return;$('#nm').textContent='جاري الرفع...';try{const m=await import('https://esm.sh/@vercel/blob@1.0.2/client');const r=await m.upload('notes-'+Date.now()+'.pdf',f,{access:'public',handleUploadUrl:'/api/upload',clientPayload:TOKEN,multipart:true});await api({action:'set_settings',cfg:{notes_file:r.url}});toast('تم الرفع والاعتماد');EXT.notes()}catch(e){$('#nm').textContent='فشل: '+e.message}}}
};
async function modList(type,label,fmt,canHide,canAnswer){const it=await tl(type);V().innerHTML=`<div class="card"><b>${label} (${it.length})</b></div>`+(it.map(p=>`<div class="card row"><div style="flex:1;min-width:230px">${fmt(p)}</div><div>${canAnswer?`<button class="b g" data-a="${esc(p.id)}">رد</button> `:''}<button class="b o" data-e="${esc(p.id)}">تعديل</button> ${p.status==='hidden'?`<button class="b g" data-s="active" data-i="${esc(p.id)}">إظهار</button>`:`<button class="b o" data-s="hidden" data-i="${esc(p.id)}">إخفاء</button>`} <button class="b r" data-d="${esc(p.id)}">حذف</button></div></div>`).join('')||'<div class="card muted">لا شيء</div>');
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{await api({action:'t_save',type,id:b.dataset.i,status:b.dataset.s});toast('تم');EXT[type]()});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('حذف نهائي؟'))return;await api({action:'t_delete',type,id:b.dataset.d});EXT[type]()});
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=async()=>{const p=it.find(x=>x.id===b.dataset.e);const t=prompt('عدّل النص',p.text);if(t===null)return;await api({action:'t_save',type,id:p.id,text:t});toast('تم');EXT[type]()});
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const p=it.find(x=>x.id===b.dataset.a);const t=prompt('ردك على السؤال',p.answer||'');if(t===null)return;await api({action:'t_save',type,id:p.id,answer:t});toast('تم');EXT[type]()})}
if(TOKEN){start()}
</script>
